<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calorie Counter</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      color: #222;
      max-width: 480px;
      margin: 0 auto;
      padding-bottom: 40px;
    }

    header {
      background: #2d7a4f;
      color: #fff;
      padding: 20px 16px 16px;
    }
    header h1 { font-size: 1.2rem; font-weight: 600; }
    header p  { font-size: 0.82rem; opacity: 0.85; margin-top: 2px; }

    .summary {
      background: #fff;
      margin: 12px 12px 0;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
    }

    .calories-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 10px;
    }
    .cal-consumed { font-size: 2rem; font-weight: 700; color: #2d7a4f; }
    .cal-goal     { font-size: 0.9rem; color: #777; }
    .cal-remaining{ font-size: 1rem; font-weight: 600; }
    .cal-remaining.over { color: #c0392b; }
    .cal-remaining.ok   { color: #2d7a4f; }

    .progress-bar {
      height: 10px;
      background: #e8e8e8;
      border-radius: 99px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      border-radius: 99px;
      background: #2d7a4f;
      transition: width 0.35s ease;
    }
    .progress-bar-fill.over { background: #c0392b; }

    .macros {
      display: flex;
      justify-content: space-around;
      margin-top: 14px;
      text-align: center;
    }
    .macro label { font-size: 0.72rem; color: #888; display: block; }
    .macro span  { font-size: 1rem; font-weight: 600; }

    section {
      margin: 12px 12px 0;
      background: #fff;
      border-radius: 12px;
      padding: 14px;
      box-shadow: 0 1px 4px rgba(0,0,0,.08);
    }
    section h2 { font-size: 0.9rem; font-weight: 600; color: #555; margin-bottom: 10px; }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 4px;
    }
    .chip {
      background: #eaf4ee;
      color: #2d7a4f;
      border: 1px solid #b8dfc9;
      border-radius: 99px;
      padding: 5px 11px;
      font-size: 0.78rem;
      cursor: pointer;
      white-space: nowrap;
    }
    .chip:active { background: #c5e8d4; }

    .entry-form {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 12px;
    }
    .entry-form input {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 0.92rem;
      width: 100%;
    }
    .entry-form input:focus { outline: none; border-color: #2d7a4f; }

    .entry-form .row { display: flex; gap: 8px; }
    .entry-form .row input { flex: 1; }

    .btn {
      background: #2d7a4f;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 11px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }
    .btn:active { background: #235f3e; }

    .log-list { list-style: none; }
    .log-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 0;
      border-bottom: 1px solid #f0f0f0;
    }
    .log-item:last-child { border-bottom: none; }
    .log-name  { font-size: 0.92rem; }
    .log-meta  { font-size: 0.78rem; color: #888; margin-top: 2px; }
    .log-cal   { font-size: 0.95rem; font-weight: 600; color: #2d7a4f; margin-right: 10px; }
    .log-del {
      background: none;
      border: none;
      font-size: 1.1rem;
      cursor: pointer;
      color: #bbb;
      padding: 0 4px;
    }
    .log-del:hover { color: #c0392b; }
    .empty-log { font-size: 0.85rem; color: #aaa; text-align: center; padding: 14px 0; }

    .reset-btn {
      background: none;
      border: 1px solid #ddd;
      color: #888;
      border-radius: 8px;
      padding: 9px;
      font-size: 0.85rem;
      cursor: pointer;
      width: 100%;
      margin-top: 12px;
    }
    .reset-btn:active { background: #f5f5f5; }
  </style>
</head>
<body>

<header>
  <h1>My Calorie Counter</h1>
  <p>Goal: 64 kg → 58 kg  |  Daily target: 1,400 kcal</p>
</header>

<div class="summary">
  <div class="calories-row">
    <span class="cal-consumed" id="consumed">0</span>
    <span class="cal-remaining ok" id="remaining">1,400 left</span>
  </div>
  <div class="progress-bar">
    <div class="progress-bar-fill" id="progress-fill" style="width:0%"></div>
  </div>
  <div class="macros">
    <div class="macro"><label>Protein</label><span id="m-protein">0g</span></div>
    <div class="macro"><label>Carbs</label><span id="m-carbs">0g</span></div>
    <div class="macro"><label>Fat</label><span id="m-fat">0g</span></div>
  </div>
</div>

<section>
  <h2>Quick Add</h2>
  <div class="chips" id="quick-chips"></div>
</section>

<section>
  <h2>Custom Entry</h2>
  <div class="entry-form">
    <input id="food-name" type="text" placeholder="Food name" />
    <div class="row">
      <input id="food-cal"     type="number" placeholder="kcal" min="0" />
      <input id="food-protein" type="number" placeholder="Protein (g)" min="0" />
    </div>
    <div class="row">
      <input id="food-carbs" type="number" placeholder="Carbs (g)" min="0" />
      <input id="food-fat"   type="number" placeholder="Fat (g)" min="0" />
    </div>
    <button class="btn" onclick="addCustomEntry()">Add to Log</button>
  </div>
</section>

<section>
  <h2>Today's Log</h2>
  <ul class="log-list" id="log-list"></ul>
  <button class="reset-btn" onclick="resetDay()">Reset day</button>
</section>

<script src="script.js"></script>
</body>
</html>
